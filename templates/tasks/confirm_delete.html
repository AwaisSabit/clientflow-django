{% extends "base.html" %}
{% block title %}Delete {{ task.title }} — ClientFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Delete {{ task.title }}?</h1>
    <p>This will permanently delete this task for {{ task.client.name }}. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete this task</button>
      <a class="btn btn-outline-secondary" href="{% url 'tasks:detail' task.pk %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
