{% extends "base.html" %}
{% block title %}Delete {{ project.name }} — ClientFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Delete {{ project.name }}?</h1>
    <p>This will permanently delete this project for {{ project.client.name }}. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete this project</button>
      <a class="btn btn-outline-secondary" href="{% url 'projects:detail' project.pk %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
