services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clientflow
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: clientflow-dev-only
    ports:
      - "5432:5432"
    volumes:
      - clientflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientflow -d clientflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clientflow_pgdata:
